name: Validate NOVA Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile main.py video_engine.py runway_engine.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript in app and arcade
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

          for filename in ("index.html", "arcade.html"):
              parser = ScriptExtractor()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              if not parser.parts:
                  raise SystemExit(f"No inline JavaScript found in {filename}")
              Path(f"/tmp/{Path(filename).stem}.js").write_text("\\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/arcade.js

  runtime-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check live JARVIS services
        env:
          BASE_URL: https://nova-cloud-c4t9.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          paths = ("/health", "/api/status", "/api/worker/status",
                   "/api/github/status", "/api/memory/status", "/api/team/status")

          def get_json(path):
              last_error = None
              for attempt in range(15):
                  try:
                      request = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "JARVIS-Runtime-Health/1.0"}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as error:
                      last_error = error
                      if attempt < 14:
                          time.sleep(10)
              raise RuntimeError(f"{path} svarade inte efter återförsök: {last_error}")

          results = {path: get_json(path) for path in paths}
          worker = results["/api/worker/status"]
          github = results["/api/github/status"]
          memory = results["/api/memory/status"]

          checks = {
              "worker_running": worker.get("worker_running") is True,
              "supabase_configured": worker.get("supabase_configured") is True,
              "push_configured": worker.get("push_configured") is True,
              "github_configured": worker.get("github_configured") is True,
              "github_draft_only": github.get("direct_push_to_main") is False,
              "memory_online": memory.get("status") == "online"
          }

          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'} {name}")

          if not all(checks.values()):
              raise SystemExit("JARVIS runtime health check failed.")

          print("All live JARVIS health checks passed.")
          PY
