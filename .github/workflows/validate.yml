name: Validate NOVA Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile main.py video_engine.py runway_engine.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript in app and arcade
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

          for filename in ("index.html", "arcade.html"):
              parser = ScriptExtractor()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              if not parser.parts:
                  raise SystemExit(f"No inline JavaScript found in {filename}")
              Path(f"/tmp/{Path(filename).stem}.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/arcade.js
      - name: Validate generated web projects
        shell: bash
        run: |
          if [ -d projects ]; then
            while IFS= read -r -d '' file; do node --check "$file"; done < <(find projects -type f -name '*.js' -print0)
            python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class LocalAssetChecker(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.missing = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("src", "href"):
                      value = values.get(key, "")
                      if not value or value.startswith(("http://", "https://", "//", "data:", "mailto:", "#")):
                          continue
                      target = (self.page.parent / value.split("?", 1)[0].split("#", 1)[0]).resolve()
                      if not target.is_file():
                          self.missing.append(value)

          for page in Path("projects").glob("*/index.html"):
              source = page.read_text(encoding="utf-8")
              if "<html" not in source.lower() or "</html>" not in source.lower():
                  raise SystemExit(f"Incomplete HTML document: {page}")
              checker = LocalAssetChecker(page)
              checker.feed(source)
              if checker.missing:
                  raise SystemExit(f"Missing local assets in {page}: {checker.missing}")
          PY
          fi
