name: Validate NOVA Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and generated projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile main.py video_engine.py video_team_engine.py video_creator_engine.py video_assets.py video_storage.py video_research.py video_jobs.py qa/smoke_live_video.py qa/test_video_jobs.py runway_engine.py kling_engine.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript in app and arcade
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)
          for filename in ("index.html", "arcade.html"):
              parser = ScriptExtractor()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              if not parser.parts:
                  raise SystemExit(f"No inline JavaScript found in {filename}")
              Path(f"/tmp/{Path(filename).stem}.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/index.js
          node --check /tmp/arcade.js
      - name: Require complete generated project structure
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path
          roots = sorted(p for p in Path("projects").iterdir() if p.is_dir()) if Path("projects").is_dir() else []
          if not roots:
              raise SystemExit("No generated projects found: refusing a false-green validation.")
          class AssetChecker(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.missing = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("src", "href"):
                      value = values.get(key, "")
                      if not value or value.startswith(("http://", "https://", "//", "data:", "mailto:", "#", "javascript:")):
                          continue
                      target = (self.page.parent / value.split("?", 1)[0].split("#", 1)[0]).resolve()
                      if not target.is_file():
                          self.missing.append(value)
          for root in roots:
              page = root / "index.html"
              if not page.is_file():
                  raise SystemExit(f"Required index.html missing: {root}")
              support = [p for p in root.iterdir() if p.is_file() and p.name != "index.html"]
              if not support:
                  raise SystemExit(f"At least one supporting file is required: {root}")
              files = [p for p in root.iterdir() if p.is_file()]
              total = 0
              for file in files:
                  raw = file.read_bytes()
                  total += len(raw)
                  if len(raw) < 40:
                      raise SystemExit(f"File is empty or suspiciously short: {file}")
                  if len(raw) > 220000:
                      raise SystemExit(f"File exceeds 220 KB: {file}")
                  if file.suffix.lower() == ".json":
                      try:
                          json.loads(raw.decode("utf-8"))
                      except Exception as error:
                          raise SystemExit(f"Invalid JSON {file}: {error}")
                  if file.suffix.lower() == ".js":
                      pass
              if total > 650000:
                  raise SystemExit(f"Project exceeds 650 KB: {root}")
              source = page.read_text(encoding="utf-8")
              if not re.search(r"<!doctype\s+html", source, re.I) or not re.search(r"<html\b", source, re.I) or not re.search(r"</html\s*>", source, re.I):
                  raise SystemExit(f"Incomplete HTML5 document: {page}")
              if not re.search(r"<body\b", source, re.I) or not re.search(r"</body\s*>", source, re.I) or not re.search(r"<title\b", source, re.I):
                  raise SystemExit(f"HTML document missing title or body: {page}")
              checker = AssetChecker(page)
              checker.feed(source)
              if checker.missing:
                  raise SystemExit(f"Missing local assets in {page}: {checker.missing}")
              print(f"PASS {root}: {len(files)} files, {total} bytes")
          PY
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find projects -type f -name '*.js' -print0)
      - name: Verify FastAPI serves the complete NEXORA project
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python qa/test_video_assets.py
          python qa/test_video_storage.py
          python qa/test_video_jobs.py
          python qa/test_video_research.py
          python qa/test_video_creator.py
          uvicorn main:app --host 127.0.0.1 --port 8765 >/tmp/nexora-api.log 2>&1 &
          echo $! >/tmp/nexora-api.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/projects/nexora-store/ >/tmp/nexora-page.html; then
              break
            fi
            sleep 1
          done
          grep -q "NEXORA" /tmp/nexora-page.html
          curl --fail --silent http://127.0.0.1:8765/projects/nexora-store/style.css | grep -q "product-grid"
          curl --fail --silent http://127.0.0.1:8765/projects/nexora-store/app.js | grep -q "function renderProducts"
          echo "Checking live trend source..."
          curl --fail --silent http://127.0.0.1:8765/api/video/team/ideas >/tmp/jarvis-trends.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/jarvis-trends.json").read_text())
          if data.get("status") != "ok" or not data.get("ideas"):
              raise SystemExit(f"Live Swedish trend feed returned no ideas: {data.get('error')}")
          print(f"PASS live trend feed: {len(data['ideas'])} current topics.")
          PY
          echo "Creating a real MP4 through the HTTP API using the free Swedish voice..."
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests
          base = "http://127.0.0.1:8765"
          response = requests.post(
              base + "/api/video/team/create",
              data={"topic": "vardagshumor och kaffe", "mode": "original",
                    "video_type": "humor", "aspect": "9:16", "duration_mode": "standard"},
              timeout=60,
          )
          response.raise_for_status()
          data = response.json()
          if data.get("status") in {"queued", "running"}:
              status_url = base + data.get("status_url", f"/api/video/team/jobs/{data.get('job_id', '')}")
              deadline = time.time() + 300
              while time.time() < deadline:
                  time.sleep(2)
                  status = requests.get(status_url, timeout=15)
                  status.raise_for_status()
                  job = status.json()
                  if job.get("status") == "failed":
                      raise SystemExit(f"Background video job failed: {job.get('error')}")
                  if job.get("status") == "completed":
                      data = job.get("result") or {}
                      break
              if data.get("status") != "completed":
                  raise SystemExit("Background video job did not finish within five minutes.")
          if data.get("status") != "completed" or data.get("format") != "9:16":
              raise SystemExit(f"HTTP video creation failed: {data}")
          Path("/tmp/jarvis-video-url.txt").write_text(data["video_url"])
          print(f"PASS live Edge TTS render: {data['resolution']} {data['format']}, job {data['job_id']}.")
          PY
          VIDEO_URL="$(cat /tmp/jarvis-video-url.txt)"
          curl --fail --silent --show-error "http://127.0.0.1:8765${VIDEO_URL}" -o /tmp/jarvis-original.mp4
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import imageio_ffmpeg
          video = Path("/tmp/jarvis-original.mp4")
          if not video.is_file() or video.stat().st_size < 10000:
              raise SystemExit("HTTP download returned an empty or incomplete MP4.")
          result = subprocess.run(
              [imageio_ffmpeg.get_ffmpeg_exe(), "-v", "error", "-i", str(video), "-map", "0:v:0", "-map", "0:a:0", "-f", "null", "-"],
              capture_output=True, text=True, timeout=120
          )
          if result.returncode:
              raise SystemExit(f"Downloaded MP4 failed audio/video decode: {result.stderr}")
          print(f"PASS HTTP MP4 download and audio/video decode: {video.stat().st_size} bytes.")
          PY
          echo "PASS FastAPI serves NEXORA HTML, CSS and JavaScript."
