name: JARVIS Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser QA (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jarvis-qa-server.log 2>&1 &
          echo $! >/tmp/jarvis-qa-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jarvis-qa-server.log
          exit 1
      - name: Run JARVIS browser smoke tests
        run: node qa/browser-smoke.mjs
