name: JARVIS job deduplication tests

on:
  pull_request:
    paths:
      - "main.py"
      - "job_dedup.py"
      - "tests/**"
      - ".github/workflows/job-dedup-tests.yml"
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "job_dedup.py"
      - "tests/**"
      - ".github/workflows/job-dedup-tests.yml"

jobs:
  job-dedup-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run job deduplication regression tests
        run: python -m unittest discover -s tests -v
