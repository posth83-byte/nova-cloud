name: Live Video Production Smoke

on:
  push:
    branches: [main, jarvis-dispatch]
    paths:
      - ".github/workflows/live-video-smoke.yml"
      - "video_creator_engine.py"
      - "video_storage.py"
      - "video_jobs.py"
      - "video_assets.py"
      - "video_research.py"
      - "qa/smoke_live_video.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-video-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Render a live video and verify private storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Create and verify a live production video
        env:
          JARVIS_BASE_URL: https://nova-cloud-c4t9.onrender.com
        run: python qa/smoke_live_video.py
