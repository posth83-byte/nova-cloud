name: JARVIS Runtime Health

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/runtime-health.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-runtime-health
  cancel-in-progress: false

jobs:
  workflow-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow structure
        run: |
          ruby -e 'require "yaml"; data = YAML.load_file(".github/workflows/runtime-health.yml"); abort "Invalid workflow structure" unless data.is_a?(Hash) && data["jobs"].is_a?(Hash) && data["jobs"].key?("runtime-health"); puts "Runtime health workflow structure validated."'

  runtime-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live JARVIS services
        env:
          BASE_URL: https://nova-cloud-c4t9.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          paths = (
              "/health",
              "/api/status",
              "/api/worker/status",
              "/api/github/status",
              "/api/memory/status",
              "/api/team/status",
          )

          def get_json(path):
              last_error = None
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "JARVIS-Runtime-Health/2.0"},
                      )
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          payload = json.loads(response.read().decode("utf-8"))
                          if not isinstance(payload, dict):
                              raise RuntimeError("Expected a JSON object")
                          return payload
                  except Exception as error:
                      last_error = error
                      if attempt < 11:
                          time.sleep(8)
              raise RuntimeError(f"{path} failed after retries: {last_error}")

          results = {path: get_json(path) for path in paths}
          health = results["/health"]
          api = results["/api/status"]
          worker = results["/api/worker/status"]
          github = results["/api/github/status"]
          memory = results["/api/memory/status"]
          team = results["/api/team/status"]

          checks = {
              "service_online": health.get("status") == "online",
              "api_online": api.get("status") == "online",
              "ai_engine_configured": bool(
                  api.get("gemini_configured") or api.get("openrouter_configured")
              ),
              "worker_running": worker.get("worker_running") is True,
              "supabase_queue_configured": worker.get("supabase_configured") is True,
              "github_configured": worker.get("github_configured") is True,
              "github_draft_only": github.get("direct_push_to_main") is False,
              "memory_online": memory.get("status") == "online",
              "team_status_available": team.get("status") in {"idle", "working", "done", "error"},
          }

          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'} {name}")

          # Push is a convenience feature; report it but do not fail core operations.
          print(
              "PASS push_notifications_configured"
              if worker.get("push_configured") is True
              else "WARN push_notifications_not_configured"
          )

          if not all(checks.values()):
              raise SystemExit("JARVIS runtime health check failed.")

          print("All required live JARVIS runtime checks passed.")
          PY
