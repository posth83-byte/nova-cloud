name: Trading tests

on:
  push:
    branches:
      - feature/jarvis-trading-paper-first
    paths:
      - "trading/**"
      - ".github/workflows/trading-tests.yml"
  pull_request:
    paths:
      - "trading/**"
      - ".github/workflows/trading-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r trading/requirements.txt
      - name: Compile application and trading modules
        run: python -m py_compile main.py trading/*.py
      - name: Run trading unit tests
        run: python -m unittest discover -s trading -p "test_*.py" -v
