name: Live video production verification

# Manual-only: live-video-smoke.yml is the single automatic production
# smoke test. Keeping this workflow manual prevents two expensive renders
# from being queued against the same 512 MiB free Render instance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-video-production:
    name: Create and verify video on live Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wait for Render auto-deploy
        run: sleep 120
      - name: Create and verify a real video on Render
        env:
          JARVIS_BASE_URL: https://nova-cloud-c4t9.onrender.com
        run: python qa/smoke_live_video.py
