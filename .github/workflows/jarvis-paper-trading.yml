name: JARVIS paper trading cycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-trading-paper
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install trading dependencies
        run: python -m pip install -r trading/requirements.txt
      - name: Run one paper-only cycle
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::Supabase secrets are not configured; paper cycle safely skipped."
            exit 0
          fi
          python trading/paper_daemon.py \
            --once \
            --state-backend supabase \
            --starting-cash 17.81 \
            --state-path /tmp/jarvis-paper-state.json
