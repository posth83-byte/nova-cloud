<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Inköpslista">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>Vår inköpslista</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#1e2822;--muted:#77827a;--green:#3f8057;--green2:#e7f3e9;--line:#e8ece7;--shadow:0 8px 28px #263c2410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}main{max-width:620px;margin:auto;padding:20px 16px 40px}
header{padding:14px 4px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:var(--green2);display:grid;place-items:center;font-size:25px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.header-actions{display:flex;gap:8px;align-items:center}.share,.notify{border:0;background:#fff;padding:12px;border-radius:14px;box-shadow:var(--shadow);font-size:19px}.notify{font-size:16px;color:var(--green)}.notify[aria-pressed="true"]{background:var(--green2)}
.summary{background:var(--green);color:white;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.summary-top{display:flex;justify-content:space-between;align-items:center}.summary h2{font-size:18px;margin:0}.summary p{margin:8px 0 0;color:#e5f4e8;font-size:14px}.progress{height:7px;background:#ffffff40;border-radius:20px;margin-top:16px;overflow:hidden}.progress>div{height:100%;background:#fff;border-radius:20px;width:0;transition:width .2s}
.add{display:flex;gap:8px;background:var(--card);padding:10px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px}.add input{min-width:0;flex:1;border:0;outline:0;padding:10px 8px;background:transparent}.add button{border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:0 18px}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:99px;font-size:13px}.chip.active{background:var(--green2);color:var(--green);border-color:#cde4d1;font-weight:700}
.list{display:block;gap:0}.item{display:flex;align-items:center;gap:6px;background:#fff;border:0;border-bottom:1px solid var(--line);padding:0 6px;margin:0;border-radius:0;box-shadow:none;min-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.item:first-child{border-top:1px solid var(--line)}.item:last-child{border-radius:0}.check{width:20px;height:20px;border:2px solid #c9d2ca;border-radius:6px;background:#fff;flex-shrink:0;display:grid;place-items:center;color:#fff;padding:0}.item.done .check{background:var(--green);border-color:var(--green)}.item.done .name{text-decoration:line-through;color:#9ba49d}.item-main{flex:1;min-width:0;line-height:1.15}.name{font-weight:600;overflow-wrap:anywhere;line-height:1.15}.meta{font-size:11px;color:var(--muted);margin-top:0;line-height:1.1}.qty{color:var(--green);font-weight:700;font-size:13px}.del{border:0;background:transparent;color:#a0aaa2;padding:0 4px;font-size:16px;line-height:1;min-width:24px;min-height:24px}
.empty{text-align:center;color:var(--muted);padding:36px 20px;background:#fff;border-radius:18px}.empty div{font-size:35px;margin-bottom:8px}.footer{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;color:var(--muted);font-size:13px}.footer button{border:0;background:transparent;color:var(--green);font-weight:700;padding:8px}.install{display:none;background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:14px;font-size:13px;color:var(--muted)}.install strong{color:var(--ink)}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#24332a;color:white;padding:12px 18px;border-radius:99px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:600px){main{padding-top:30px}.summary{padding:24px}}
</style></head><body><main>
<header><div class="brand"><div class="logo">🛒</div><div><h1>Vår inköpslista</h1><p id="syncStatus">Bara på den här telefonen · tryck ↗ för att dela</p></div></div><div class="header-actions"><button class="notify" id="notify" aria-label="Aktivera notiser" aria-pressed="false" title="Aktivera notiser">🔔</button><button class="share" id="share" aria-label="Dela listan">↗</button></div></header>
<div class="install" id="install"><strong>📲 Lägg till på hemskärmen</strong><br>På iPhone: tryck på Dela i Safari och välj ”Lägg till på hemskärmen”.</div>
<section class="summary"><div class="summary-top"><h2>Att handla</h2><strong id="count">0 varor</strong></div><p id="progressText">Lägg till det ni behöver</p><div class="progress"><div id="progressBar"></div></div></section>
<form class="add" id="addForm"><input id="itemInput" placeholder="Vad behöver vi köpa?" autocomplete="off" required><button type="submit">＋ Lägg till</button></form>
<nav class="filters" id="filters"></nav><section class="list" id="list"></section>
<div class="footer"><span id="remaining">0 kvar</span><button id="clear">Rensa avklarade</button></div>
</main><div class="toast" id="toast"></div>
<script>
const API_BASE="https://nova-cloud-c4t9.onrender.com";
const categories=["Allt","Frukt & grönt","Mejeri","Kött & fisk","Skafferi","Frys","Hushåll","Övrigt"];
let items=JSON.parse(localStorage.getItem("shoppingItems")||"[]"),filter="Allt";
let listToken=localStorage.getItem("shoppingListToken")||"",lastUpdated=null,pollBusy=false,pendingMutations=0;
const $=id=>document.getElementById(id);
const incoming=new URLSearchParams(location.hash.slice(1)).get("list");
if(incoming){listToken=incoming;localStorage.setItem("shoppingListToken",listToken);history.replaceState(null,"",location.pathname+location.search)}
function setSyncStatus(message){$("syncStatus").textContent=message}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,method="GET",body){
 const headers={};
 if(listToken)headers.Authorization="Bearer "+listToken;
 if(body!==undefined)headers["Content-Type"]="application/json";
 const response=await fetch(API_BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!response.ok){let message="Serverfel ("+response.status+")";try{const data=await response.json();message=data.detail||message}catch{}throw new Error(message)}
 return response.status===204?null:response.json();
}
function saveLocal(){localStorage.setItem("shoppingItems",JSON.stringify(items));render()}
async function refreshSharedList(silent=false,suppressNotifications=false){
 if(!listToken||pendingMutations>0)return;
 try{
  const data=await api("/api/shopping-list");
  const nextItems=Array.isArray(data.items)?data.items:[];
  // Notifications arrive through Web Push, including when this page is closed.
  items=nextItems;
  lastUpdated=data.updated_at||null;
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  setSyncStatus("Delad lista · synkas automatiskt");
  render();
 }catch(error){
  setSyncStatus("Återansluter till den delade listan…");
  if(!silent)toast("Kunde inte synka: "+error.message);
  throw error;
 }
}
async function mutateShared(path,method,body,rollback){
 pendingMutations++;
 try{
  await api(path,method,body);
  setSyncStatus("Delad lista · synkas automatiskt");
 }catch(error){
  if(rollback)rollback();
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  render();
  toast("Ändringen sparades inte: "+error.message);
  setSyncStatus("Anslutningen saknas – försöker igen");
 }finally{
  pendingMutations=Math.max(0,pendingMutations-1);
 }
}
function render(){
 $("filters").innerHTML=categories.map(c=>'<button class="chip '+(filter===c?"active":"")+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join("");
 $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 const shown=items.filter(x=>filter==="Allt"||x.category===filter),unchecked=items.filter(x=>!x.done).length,done=items.length-unchecked;
 $("count").textContent=items.length+" varor";$("remaining").textContent=unchecked+" kvar";
 $("progressText").textContent=items.length?done+" av "+items.length+" avklarade":"Lägg till det ni behöver";
 $("progressBar").style.width=(items.length?done/items.length*100:0)+"%";
 $("list").innerHTML=shown.length?shown.map(x=>'<article class="item '+(x.done?"done":"")+'" data-item-id="'+esc(x.id)+'"><button class="check" data-check="'+esc(x.id)+'" aria-label="'+(x.done?"Markera som ej klar":"Markera som klar")+'">'+(x.done?"✓":"")+'</button><div class="item-main"><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.category)+(x.qty?" · "+esc(x.qty):"")+'</div></div><button class="del" data-del="'+esc(x.id)+'" aria-label="Ta bort">×</button></article>').join(""):'<div class="empty"><div>🧺</div>Listan är tom. Lägg till något ni behöver!</div>';
 $("list").querySelectorAll(".item[data-item-id]").forEach(row=>{
  const toggle=async()=>{
   const x=items.find(x=>String(x.id)===row.dataset.itemId);if(!x)return;
   const previous=x.done;
   x.done=!x.done;
   localStorage.setItem("shoppingItems",JSON.stringify(items));
   render();
   if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(x.id),"PATCH",{done:x.done},()=>{x.done=previous});
   else saveLocal()
  };
  row.onclick=e=>{if(e.target.closest("[data-del]"))return;toggle()};
  row.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target===row){e.preventDefault();toggle()}};
  row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-label","Tryck för att bocka av "+row.querySelector(".name").textContent);
 });
 $("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{
  e.stopPropagation();
  const index=items.findIndex(x=>String(x.id)===b.dataset.del);
  if(index<0)return;
  const removed=items.splice(index,1)[0];
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  render();
  if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(b.dataset.del),"DELETE",undefined,()=>items.splice(Math.min(index,items.length),0,removed));
  else saveLocal()
 });
}
function guessCategory(name){let s=name.toLowerCase();if(/mjölk|ost|smör|yoghurt|grädde|ägg|fil/.test(s))return"Mejeri";if(/äpple|banan|tomat|gurka|potatis|sallad|lök|frukt|grön/.test(s))return"Frukt & grönt";if(/kött|kyckling|fisk|korv|färs|bacon/.test(s))return"Kött & fisk";if(/bröd|pasta|ris|mjöl|kaffe|te|socker|konserv|sås/.test(s))return"Skafferi";if(/glass|fryst|frys/.test(s))return"Frys";if(/disk|tvätt|toalett|papper|såpa|rengör/.test(s))return"Hushåll";return"Övrigt"}
$("addForm").onsubmit=async e=>{
 e.preventDefault();let name=$("itemInput").value.trim();if(!name)return;
 const item={name,category:guessCategory(name),qty:""};
 if(listToken){
  try{
   const response=await api("/api/shopping-list/items","POST",{...item,source_endpoint:await currentPushEndpoint()});
   if(!response||!response.item||!response.item.id)throw new Error("Servern bekräftade inte att varan sparades.");
   items.unshift(response.item);
   localStorage.setItem("shoppingItems",JSON.stringify(items));
   render();
   $("itemInput").value="";
   $("itemInput").focus();
   setSyncStatus("Delad lista · synkas automatiskt");
  }catch(error){
   toast("Varan kunde inte sparas: "+error.message);
   setSyncStatus("Kunde inte spara · försök igen");
   $("itemInput").focus();
  }
 }else{
  items.unshift({id:crypto.randomUUID(),...item,done:false});
  saveLocal();
  $("itemInput").value="";
  $("itemInput").focus();
 }
};
$("clear").onclick=()=>{
 const previous=items;
 items=items.filter(x=>!x.done);
 localStorage.setItem("shoppingItems",JSON.stringify(items));
 render();
 if(listToken)mutateShared("/api/shopping-list/clear-completed","POST",{},()=>{items=previous});
 else saveLocal();
};
async function shareList(){
 try{
  if(!listToken){
   const response=await fetch(API_BASE+"/api/shopping-list",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});
   if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.detail||"Kunde inte skapa delad lista")}
   const data=await response.json();listToken=data.token;lastUpdated=data.updated_at;
   localStorage.setItem("shoppingListToken",listToken);items=data.items||[];
   localStorage.setItem("shoppingItems",JSON.stringify(items));render();
   setSyncStatus("Delad lista · synkas automatiskt");
  }
  if(localStorage.getItem("shoppingNotificationsEnabled")==="yes"){
   try{await ensurePushSubscription()}catch(error){toast("Listan delades, men notiser kunde inte kopplas: "+error.message)}
  }
  const url=location.origin+location.pathname+"#list="+encodeURIComponent(listToken);
  if(navigator.share)await navigator.share({title:"Vår inköpslista",text:"Öppna vår gemensamma inköpslista",url});
  else{await navigator.clipboard.writeText(url);toast("Delningslänken kopierad!")}
 }catch(error){if(error.name!=="AbortError")toast(error.message||"Kunde inte dela listan")}
}
$("share").onclick=shareList;

function urlBase64ToUint8Array(value){
 const padding="=".repeat((4-value.length%4)%4);
 const raw=atob((value+padding).replace(/-/g,"+").replace(/_/g,"/"));
 return Uint8Array.from([...raw].map(char=>char.charCodeAt(0)));
}
async function ensurePushSubscription(){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)||Notification.permission!=="granted")return null;
 const registration=await navigator.serviceWorker.register("./sw.js");
 await navigator.serviceWorker.ready;
 const keyResponse=await fetch(API_BASE+"/api/push/public-key",{cache:"no-store"});
 if(!keyResponse.ok)throw new Error("Pushnotiser är inte konfigurerade på servern.");
 const keyData=await keyResponse.json();
 let subscription=await registration.pushManager.getSubscription();
 if(!subscription){
  subscription=await registration.pushManager.subscribe({
   userVisibleOnly:true,
   applicationServerKey:urlBase64ToUint8Array(keyData.public_key)
  });
 }
 if(listToken){
  await api("/api/shopping-list/push/subscribe","POST",{subscription:subscription.toJSON()});
 }
 return subscription;
}
async function currentPushEndpoint(){
 if(localStorage.getItem("shoppingNotificationsEnabled")!=="yes"||!("serviceWorker" in navigator))return "";
 try{
  const registration=await navigator.serviceWorker.ready;
  const subscription=await registration.pushManager.getSubscription();
  return subscription?subscription.endpoint:"";
 }catch{return ""}
}
async function enableNotifications(){
 if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){
  toast("Den här webbläsaren stöder inte bakgrundsnotiser.");return;
 }
 try{
  const permission=await Notification.requestPermission();
  if(permission!=="granted"){toast("Notiser tilläts inte. Du kan ändra det i inställningarna.");return}
  localStorage.setItem("shoppingNotificationsEnabled","yes");
  const subscription=await ensurePushSubscription();
  if(!subscription)throw new Error("Kunde inte skapa en pushprenumeration.");
  $("notify").setAttribute("aria-pressed","true");
  toast(listToken?"Bakgrundsnotiser aktiverade på den här enheten":"Tillåtet! Notiser kopplas till listan när den delas.");
 }catch(error){toast("Kunde inte aktivera notiser: "+error.message)}
}
$("notify").onclick=enableNotifications;
if(localStorage.getItem("shoppingNotificationsEnabled")==="yes"&&"Notification" in window&&Notification.permission==="granted")$("notify").setAttribute("aria-pressed","true");

function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
render();
if(!navigator.standalone&&!window.matchMedia("(display-mode: standalone)").matches&&/iPhone|iPad/.test(navigator.userAgent))$("install").style.display="block";
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
if(listToken){
 setSyncStatus("Ansluter till den delade listan…");
 refreshSharedList(false).catch(()=>{});
 if(localStorage.getItem("shoppingNotificationsEnabled")==="yes"&&"Notification" in window&&Notification.permission==="granted"){
  ensurePushSubscription().catch(error=>toast("Notiser kunde inte återanslutas: "+error.message));
 }
}else{
 setSyncStatus("Bara på den här telefonen · tryck ↗ för att dela");
}
setInterval(async()=>{if(listToken&&!pollBusy){pollBusy=true;try{await refreshSharedList(true)}catch{}finally{pollBusy=false}}},3000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&listToken)refreshSharedList(true).catch(()=>{})});
</script></body></html>
