<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Inköpslista">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>Vår inköpslista</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#1e2822;--muted:#77827a;--green:#3f8057;--green2:#e7f3e9;--line:#e8ece7;--shadow:0 8px 28px #263c2410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}main{max-width:620px;margin:auto;padding:20px 16px 40px}
header{padding:14px 4px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:var(--green2);display:grid;place-items:center;font-size:25px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.share{border:0;background:#fff;padding:12px;border-radius:14px;box-shadow:var(--shadow);font-size:19px}
.summary{background:var(--green);color:white;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.summary-top{display:flex;justify-content:space-between;align-items:center}.summary h2{font-size:18px;margin:0}.summary p{margin:8px 0 0;color:#e5f4e8;font-size:14px}.progress{height:7px;background:#ffffff40;border-radius:20px;margin-top:16px;overflow:hidden}.progress>div{height:100%;background:#fff;border-radius:20px;width:0;transition:width .2s}
.add{display:flex;gap:8px;background:var(--card);padding:10px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px}.add input{min-width:0;flex:1;border:0;outline:0;padding:10px 8px;background:transparent}.add button{border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:0 18px}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:99px;font-size:13px}.chip.active{background:var(--green2);color:var(--green);border-color:#cde4d1;font-weight:700}
.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:14px;border-radius:17px;box-shadow:var(--shadow)}.check{width:25px;height:25px;border:2px solid #c9d2ca;border-radius:8px;background:#fff;flex-shrink:0;display:grid;place-items:center;color:#fff}.item.done .check{background:var(--green);border-color:var(--green)}.item.done .name{text-decoration:line-through;color:#9ba49d}.item-main{flex:1;min-width:0}.name{font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:3px}.qty{color:var(--green);font-weight:700;font-size:13px}.del{border:0;background:transparent;color:#a0aaa2;padding:8px;font-size:18px}
.empty{text-align:center;color:var(--muted);padding:36px 20px;background:#fff;border-radius:18px}.empty div{font-size:35px;margin-bottom:8px}.footer{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;color:var(--muted);font-size:13px}.footer button{border:0;background:transparent;color:var(--green);font-weight:700;padding:8px}.install{display:none;background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:14px;font-size:13px;color:var(--muted)}.install strong{color:var(--ink)}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#24332a;color:white;padding:12px 18px;border-radius:99px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:600px){main{padding-top:30px}.summary{padding:24px}}
</style></head><body><main>
<header><div class="brand"><div class="logo">🛒</div><div><h1>Vår inköpslista</h1><p>En lista, två personer ❤️</p></div></div><button class="share" id="share" aria-label="Dela listan">↗</button></header>
<div class="install" id="install"><strong>📲 Lägg till på hemskärmen</strong><br>På iPhone: tryck på Dela i Safari och välj ”Lägg till på hemskärmen”.</div>
<section class="summary"><div class="summary-top"><h2>Att handla</h2><strong id="count">0 varor</strong></div><p id="progressText">Lägg till det ni behöver</p><div class="progress"><div id="progressBar"></div></div></section>
<form class="add" id="addForm"><input id="itemInput" placeholder="Vad behöver vi köpa?" autocomplete="off" required><button type="submit">＋ Lägg till</button></form>
<nav class="filters" id="filters"></nav><section class="list" id="list"></section>
<div class="footer"><span id="remaining">0 kvar</span><button id="clear">Rensa avklarade</button></div>
</main><div class="toast" id="toast"></div>
<script>
const categories=["Allt","Frukt & grönt","Mejeri","Kött & fisk","Skafferi","Frys","Hushåll","Övrigt"];
let items=JSON.parse(localStorage.getItem("shoppingItems")||"[]"),filter="Allt";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("shoppingItems",JSON.stringify(items));render()}
function render(){
 $("filters").innerHTML=categories.map(c=>'<button class="chip '+(filter===c?"active":"")+'" data-filter="'+c+'">'+c+'</button>').join("");
 $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 let shown=items.filter(x=>filter==="Allt"||x.category===filter),unchecked=items.filter(x=>!x.done).length,done=items.length-unchecked;
 $("count").textContent=items.length+" varor";$("remaining").textContent=unchecked+" kvar";
 $("progressText").textContent=items.length?done+" av "+items.length+" avklarade":"Lägg till det ni behöver";
 $("progressBar").style.width=(items.length?done/items.length*100:0)+"%";
 $("list").innerHTML=shown.length?shown.map(x=>'<article class="item '+(x.done?"done":"")+'"><button class="check" data-check="'+x.id+'">'+(x.done?"✓":"")+'</button><div class="item-main"><div class="name">'+esc(x.name)+'</div><div class="meta">'+x.category+(x.qty?" · "+esc(x.qty):"")+'</div></div><button class="del" data-del="'+x.id+'" aria-label="Ta bort">×</button></article>').join():'<div class="empty"><div>'+(items.length?'✨':'🧺')+'</div>'+(items.length?'Inga varor i den här kategorin.':'Listan är tom. Lägg till något ni behöver!')+'</div>';
 $("list").querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.check);x.done=!x.done;save()});
 $("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.del);save()});
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function guessCategory(name){let s=name.toLowerCase();if(/mjölk|ost|smör|yoghurt|grädde|ägg|fil/.test(s))return"Mejeri";if(/äpple|banan|tomat|gurka|potatis|sallad|lök|frukt|grön/.test(s))return"Frukt & grönt";if(/kött|kyckling|fisk|korv|färs|bacon/.test(s))return"Kött & fisk";if(/bröd|pasta|ris|mjöl|kaffe|te|socker|konserv|sås/.test(s))return"Skafferi";if(/glass|fryst|frys/.test(s))return"Frys";if(/disk|tvätt|toalett|papper|såpa|rengör/.test(s))return"Hushåll";return"Övrigt"}
$("addForm").onsubmit=e=>{e.preventDefault();let name=$("itemInput").value.trim();if(!name)return;items.unshift({id:crypto.randomUUID(),name,category:guessCategory(name),qty:"",done:false});$("itemInput").value="";save();$("itemInput").focus()};
$("clear").onclick=()=>{items=items.filter(x=>!x.done);save()};
$("share").onclick=async()=>{let text="🛒 Vår inköpslista\n"+items.filter(x=>!x.done).map(x=>"• "+x.name+(x.qty?" ("+x.qty+")":"")).join("\n");if(!items.filter(x=>!x.done).length)text+="\nListan är tom";try{if(navigator.share)await navigator.share({title:"Vår inköpslista",text});else{await navigator.clipboard.writeText(text);toast("Listan kopierad!")}}catch{}};
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
render();
if(!navigator.standalone&&/iPhone|iPad/.test(navigator.userAgent)) $("install").style.display="block";
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
