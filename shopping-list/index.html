<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Inköpslista">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>Vår inköpslista</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#1e2822;--muted:#77827a;--green:#3f8057;--green2:#e7f3e9;--line:#e8ece7;--shadow:0 8px 28px #263c2410}body.dark{--bg:#151a17;--card:#202823;--ink:#edf3ee;--muted:#a1ada4;--green:#76b889;--green2:#293e30;--line:#354139;--shadow:0 8px 28px #0005}body.dark .share,body.dark .notify,body.dark .chip,body.dark .empty,body.dark .add{background:var(--card);color:var(--ink)}body.dark .item{background:var(--card)}body.dark .check{background:#202823;border-color:#59665d}body.dark .item.done .check{background:var(--green);border-color:var(--green)}body.dark .summary{background:#315e40}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}body.has-custom-bg{background:transparent}body.has-custom-bg::before{content:"";position:fixed;inset:0;z-index:0;background-image:var(--shopping-bg-image);background-size:cover;background-position:center;background-repeat:no-repeat;opacity:var(--shopping-bg-opacity,.22);pointer-events:none}body.has-custom-bg main{position:relative;z-index:1}body.has-custom-bg .item,body.has-custom-bg .add,body.has-custom-bg .details-panel,body.has-custom-bg .menu-panel,body.has-custom-bg .empty{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}button,input,select{font:inherit}main{max-width:620px;margin:auto;padding:20px 16px 40px}
header{padding:14px 4px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:var(--green2);display:grid;place-items:center;font-size:25px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.header-actions{display:flex;gap:8px;align-items:center}.share,.notify{border:0;background:#fff;padding:12px;border-radius:14px;box-shadow:var(--shadow);font-size:19px}.notify{font-size:16px;color:var(--green)}.notify[aria-pressed="true"]{background:var(--green2)}
.summary{background:var(--green);color:white;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.summary-top{display:flex;justify-content:space-between;align-items:center}.summary h2{font-size:18px;margin:0}.summary p{margin:8px 0 0;color:#e5f4e8;font-size:14px}.progress{height:7px;background:#ffffff40;border-radius:20px;margin-top:16px;overflow:hidden}.progress>div{height:100%;background:#fff;border-radius:20px;width:0;transition:width .2s}
.add{display:flex;gap:8px;background:var(--card);padding:10px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px}.add input{min-width:0;flex:1;border:0;outline:0;padding:10px 8px;background:transparent;color:var(--ink);caret-color:var(--green);font-size:16px;-webkit-text-fill-color:var(--ink)}.add input::placeholder{color:var(--muted);opacity:1;-webkit-text-fill-color:var(--muted)}.details-panel input{color:var(--ink);caret-color:var(--green);font-size:16px;-webkit-text-fill-color:var(--ink)}.details-panel input::placeholder{color:var(--muted);opacity:1;-webkit-text-fill-color:var(--muted)}.add button{border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:0 18px}.add button:disabled{opacity:.72;cursor:wait}.suggestions{display:flex;gap:7px;overflow-x:auto;padding:0 0 13px;margin-top:-5px;min-height:0}.suggestions:empty{display:none}.suggestion{white-space:nowrap;border:1px solid var(--line);background:var(--green2);color:var(--green);padding:7px 11px;border-radius:99px;font-size:12px;font-weight:650}.suggestion:active{transform:scale(.97)}.suggestions-label{align-self:center;color:var(--muted);font-size:11px;white-space:nowrap;padding-right:2px}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:99px;font-size:13px}.chip.active{background:var(--green2);color:var(--green);border-color:#cde4d1;font-weight:700}
.list{display:block;gap:0}.item{display:flex;align-items:center;gap:7px;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:5px 6px;margin:0;border-radius:0;box-shadow:none;min-height:52px;cursor:pointer;-webkit-tap-highlight-color:transparent}.item-main{flex:1;min-width:0;line-height:1.15}.item-extra{display:flex;align-items:center;gap:7px}.price{font-size:11px;color:var(--muted);font-weight:600}.favorite{border:0;background:transparent;color:#c4a64a;padding:4px;font-size:17px;min-width:25px;min-height:25px}.favorite:not(.on){color:#b8c0b9}.details-toggle,.menu-toggle{border:0;background:var(--card);color:var(--green);border-radius:12px;padding:9px 12px;font-weight:650;box-shadow:var(--shadow)}.details-panel{display:none;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:14px;margin:-5px 0 12px;gap:8px}.details-panel.open{display:flex;align-items:center;flex-wrap:wrap}.details-panel input{min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--ink);max-width:140px}.menu-panel{display:none;background:var(--card);border:1px solid var(--line);padding:8px;border-radius:14px;margin:-10px 0 14px;box-shadow:var(--shadow)}.menu-panel.open{display:flex;gap:7px;flex-wrap:wrap}.menu-panel button{border:0;background:var(--green2);color:var(--ink);padding:9px 11px;border-radius:10px;font-size:13px}.theme-control{display:flex;align-items:center;gap:8px;background:var(--green2);color:var(--ink);padding:6px 10px;border-radius:10px;font-size:13px}.theme-control select{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 8px;font-size:13px}.background-control{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;padding:8px 4px;border-top:1px solid var(--line);color:var(--ink);font-size:13px}.background-control strong{width:100%}.background-control button{background:var(--green2);border:0;border-radius:10px;padding:8px 11px;color:var(--ink);font-size:13px}.background-control label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.background-control input[type=range]{width:105px;accent-color:var(--green)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:18px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:min(100%,480px);max-height:80vh;overflow:auto}.modal-card h2{margin:0 0 12px}.modal-close{float:right;border:0;background:var(--green2);color:var(--ink);border-radius:9px;padding:7px 10px}.history-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.history-row small{display:block;color:var(--muted)}.item:first-child{border-top:1px solid var(--line)}.item:last-child{border-radius:0}.check{width:20px;height:20px;border:2px solid #c9d2ca;border-radius:6px;background:#fff;flex-shrink:0;display:grid;place-items:center;color:#fff;padding:0}.item.done .check{background:var(--green);border-color:var(--green)}.item.done .name{text-decoration:line-through;color:#9ba49d}.item-main{flex:1;min-width:0;line-height:1.15}.name{font-weight:600;overflow-wrap:anywhere;line-height:1.15}.meta{font-size:11px;color:var(--muted);margin-top:0;line-height:1.1}.qty{color:var(--green);font-weight:700;font-size:13px}.del{border:0;background:transparent;color:#a0aaa2;padding:0 4px;font-size:16px;line-height:1;min-width:24px;min-height:24px}
.empty{text-align:center;color:var(--muted);padding:36px 20px;background:#fff;border-radius:18px}.empty div{font-size:35px;margin-bottom:8px}.footer{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;color:var(--muted);font-size:13px}.footer button{border:0;background:transparent;color:var(--green);font-weight:700;padding:8px}.install{display:none;background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:14px;font-size:13px;color:var(--muted)}.install strong{color:var(--ink)}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#24332a;color:white;padding:12px 18px;border-radius:99px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;pointer-events:auto}
@media(min-width:600px){main{padding-top:30px}.summary{padding:24px}}
</style></head><body><main>
<header><div class="brand"><div class="logo">🛒</div><div><h1>Vår inköpslista</h1><p id="syncStatus">Bara på den här telefonen · tryck ↗ för att dela</p></div></div><div class="header-actions"><button class="notify" id="notify" aria-label="Aktivera notiser" aria-pressed="false" title="Aktivera notiser">🔔</button><button class="share" id="share" aria-label="Dela listan">↗</button></div></header>
<div class="install" id="install"><strong>📲 Lägg till på hemskärmen</strong><br>På iPhone: tryck på Dela i Safari och välj ”Lägg till på hemskärmen”.</div>
<section class="summary"><div class="summary-top"><h2>Att handla</h2><strong id="count">0 varor</strong></div><p id="progressText">Lägg till det ni behöver</p><div class="progress"><div id="progressBar"></div></div></section>
<form class="add" id="addForm"><input id="itemInput" placeholder="Varor, separerade med kommatecken" autocomplete="off" required><button type="submit">＋ Lägg till</button></form>
<div class="suggestions" id="suggestions" aria-label="Vanliga varor"></div>
<button class="details-toggle" id="extrasToggle" type="button">＋ Lägg till pris</button>
<div class="details-panel" id="extrasPanel"><input id="itemPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Pris (kr)"></div>
<button class="menu-toggle" id="menuToggle" type="button" style="margin:0 0 10px">☰ Fler funktioner</button>
<div class="menu-panel" id="menuPanel"><button id="templatesBtn" type="button">Färdiga listor</button><button id="historyBtn" type="button">Historik</button><button id="favoritesBtn" type="button">★ Favoriter</button><label class="theme-control" for="themeSelect">Tema<select id="themeSelect"><option value="system">Följ mobilen</option><option value="light">Ljust</option><option value="dark">Mörkt</option></select></label><div class="background-control"><strong>Egen bakgrund</strong><input id="backgroundFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="chooseBackground" type="button">Välj bild</button><button id="importBackground" type="button">Hämta min bakgrund</button><button id="removeBackground" type="button">Återställ</button><label for="backgroundOpacity">Diskrethet <input id="backgroundOpacity" type="range" min="8" max="45" value="22"></label></div></div>
<nav class="filters" id="filters"></nav><section class="list" id="list"></section>
<div class="footer"><span id="remaining">0 kvar</span><button id="clear">Rensa avklarade</button></div>
</main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><button class="modal-close" id="modalClose">Stäng</button><div id="modalContent"></div></div></div>
<script>
const API_BASE="https://nova-cloud-c4t9.onrender.com";
const categories=["Allt","Frukt & grönt","Mejeri","Kött & fisk","Skafferi","Frys","Hushåll","Övrigt"];
let items=JSON.parse(localStorage.getItem("shoppingItems")||"[]"),filter="Allt",showFavorites=false,showRemainingOnly=false,lastUndo=null;
let listToken=localStorage.getItem("shoppingListToken")||"",lastUpdated=null,pollBusy=false,pendingMutations=0;
const $=id=>document.getElementById(id);
const incoming=new URLSearchParams(location.hash.slice(1)).get("list");
if(incoming){listToken=incoming;localStorage.setItem("shoppingListToken",listToken)}
function setSyncStatus(message){$("syncStatus").textContent=message}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,method="GET",body){
 const headers={};
 if(listToken)headers.Authorization="Bearer "+listToken;
 if(body!==undefined)headers["Content-Type"]="application/json";
 const response=await fetch(API_BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!response.ok){let message="Serverfel ("+response.status+")";try{const data=await response.json();message=data.detail||message}catch{}throw new Error(message)}
 return response.status===204?null:response.json();
}
function saveLocal(){localStorage.setItem("shoppingItems",JSON.stringify(items));render()}
let recentSuggestions=JSON.parse(localStorage.getItem("shoppingRecentItems")||"[]");
function rememberSuggestion(name){
 const clean=String(name||"").trim();
 if(!clean)return;
 recentSuggestions=[clean,...recentSuggestions.filter(x=>String(x).toLowerCase()!==clean.toLowerCase())].slice(0,18);
 localStorage.setItem("shoppingRecentItems",JSON.stringify(recentSuggestions));
 renderSuggestions();
}
function renderSuggestions(){
 const current=new Set(items.filter(x=>!x.done).map(x=>String(x.name||"").toLocaleLowerCase("sv-SE")));
 const choices=recentSuggestions.filter(name=>!current.has(String(name).toLocaleLowerCase("sv-SE"))).slice(0,7);
 $("suggestions").innerHTML=choices.length?'<span class="suggestions-label">Vanliga</span>'+choices.map(name=>'<button class="suggestion" type="button" data-suggest="'+esc(name)+'">＋ '+esc(name)+'</button>').join(""):"";
 $("suggestions").querySelectorAll("[data-suggest]").forEach(button=>button.onclick=()=>{
  $("itemInput").value=button.dataset.suggest;
  $("addForm").requestSubmit();
 });
}
async function loadSharedSuggestions(){
 if(!listToken)return;
 try{
  const data=await api("/api/shopping-list/history");
  const names=(data.items||[]).map(x=>x.name).filter(Boolean);
  recentSuggestions=[...new Map([...names,...recentSuggestions].map(name=>[String(name).toLocaleLowerCase("sv-SE"),String(name)])).values()].slice(0,18);
  localStorage.setItem("shoppingRecentItems",JSON.stringify(recentSuggestions));
  renderSuggestions();
 }catch{}
}

async function refreshSharedList(silent=false,suppressNotifications=false){
 if(!listToken||pendingMutations>0)return;
 try{
  const data=await api("/api/shopping-list");
  const nextItems=Array.isArray(data.items)?data.items:[];
  // Notifications arrive through Web Push, including when this page is closed.
  items=nextItems;
  lastUpdated=data.updated_at||null;
  loadSharedBackground(data.background_path||"").catch(()=>{});
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  setSyncStatus("Delad lista · synkas automatiskt");
  render();
 }catch(error){
  setSyncStatus("Återansluter till den delade listan…");
  if(!silent)toast("Kunde inte synka: "+error.message);
  throw error;
 }
}
async function mutateShared(path,method,body,rollback){
 pendingMutations++;
 try{
  await api(path,method,body);
  setSyncStatus("Delad lista · synkas automatiskt");
 }catch(error){
  if(rollback)rollback();
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  render();
  toast("Ändringen sparades inte: "+error.message);
  setSyncStatus("Anslutningen saknas – försöker igen");
 }finally{
  pendingMutations=Math.max(0,pendingMutations-1);
 }
}
function render(){
 renderSuggestions();
 $("filters").innerHTML='<button class="chip '+(showRemainingOnly?"active":"")+'" id="remainingFilter">Kvar att handla</button>'+categories.map(c=>'<button class="chip '+(filter===c?"active":"")+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join("");
 $("remainingFilter").onclick=()=>{showRemainingOnly=!showRemainingOnly;render()};
 $("filters").querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 const shown=items.filter(x=>(filter==="Allt"||x.category===filter)&&(!showFavorites||x.is_favorite)&&(!showRemainingOnly||!x.done)),unchecked=items.filter(x=>!x.done).length,done=items.length-unchecked;
 $("count").textContent=items.length+" varor";$("remaining").textContent=unchecked+" kvar";
 $("progressText").textContent=items.length?done+" av "+items.length+" avklarade":"Lägg till det ni behöver";
 $("progressBar").style.width=(items.length?done/items.length*100:0)+"%";
 $("list").innerHTML=shown.length?shown.map(x=>'<article class="item '+(x.done?"done":"")+'" data-item-id="'+esc(x.id)+'"><button class="check" data-check="'+esc(x.id)+'" aria-label="'+(x.done?"Markera som ej klar":"Markera som klar")+'">'+(x.done?"✓":"")+'</button><div class="item-main"><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.category)+(x.qty?" · "+esc(x.qty):"")+'</div>'+(x.price!==null&&x.price!==undefined&&x.price!==""?'<div class="price">'+Number(x.price).toLocaleString("sv-SE",{minimumFractionDigits:2,maximumFractionDigits:2})+' kr</div>':'')+'</div><button class="favorite '+(x.is_favorite?"on":"")+'" data-fav="'+esc(x.id)+'" aria-label="Favorit">'+(x.is_favorite?"★":"☆")+'</button><button class="favorite" data-edit="'+esc(x.id)+'" aria-label="Ändra pris">✎</button><button class="del" data-del="'+esc(x.id)+'" aria-label="Ta bort">×</button></article>').join(""):'<div class="empty"><div>🧺</div>Listan är tom. Lägg till något ni behöver!</div>';
 $("list").querySelectorAll(".item[data-item-id]").forEach(row=>{
  const toggle=async()=>{
   const x=items.find(x=>String(x.id)===row.dataset.itemId);if(!x)return;
   const previous=x.done;
   x.done=!x.done;
   localStorage.setItem("shoppingItems",JSON.stringify(items));
   render();
   setUndo(x.done?"Varan avbockad":"Avbockningen ångrad",async()=>{x.done=previous;if(listToken)await api("/api/shopping-list/items/"+encodeURIComponent(x.id),"PATCH",{done:previous});localStorage.setItem("shoppingItems",JSON.stringify(items));render()});
   if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(x.id),"PATCH",{done:x.done},()=>{x.done=previous});
   else saveLocal()
  };
  row.onclick=e=>{if(e.target.closest("[data-del]"))return;toggle()};
  row.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target===row){e.preventDefault();toggle()}};
  row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-label","Tryck för att bocka av "+row.querySelector(".name").textContent);
 });
 $("list").querySelectorAll("[data-edit]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const x=items.find(x=>String(x.id)===b.dataset.edit);if(!x)return;const raw=prompt("Ange pris i kronor (lämna tomt för inget pris):",x.price??"");if(raw===null)return;const value=raw.trim()===""?null:Number(raw.replace(",","."));if(value!==null&&(!Number.isFinite(value)||value<0||value>999999)){toast("Ange ett giltigt pris.");return}const old=x.price;x.price=value;localStorage.setItem("shoppingItems",JSON.stringify(items));render();if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(x.id),"PATCH",{price:value},()=>{x.price=old})});
 $("list").querySelectorAll("[data-fav]").forEach(b=>b.onclick=e=>{e.stopPropagation();const x=items.find(x=>String(x.id)===b.dataset.fav);if(!x)return;const old=!!x.is_favorite;x.is_favorite=!old;localStorage.setItem("shoppingItems",JSON.stringify(items));render();if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(x.id),"PATCH",{is_favorite:x.is_favorite},()=>{x.is_favorite=old});});
 $("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{
  e.stopPropagation();
  const index=items.findIndex(x=>String(x.id)===b.dataset.del);
  if(index<0)return;
  const removed=items.splice(index,1)[0];
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  render();
  setUndo("Varan togs bort",async()=>{if(listToken){const response=await api("/api/shopping-list/items","POST",{name:removed.name,category:removed.category,qty:removed.qty||"",price:removed.price??null,is_favorite:!!removed.is_favorite,source_endpoint:await currentPushEndpoint()});if(response.item)items.unshift(response.item)}else items.splice(Math.min(index,items.length),0,removed);localStorage.setItem("shoppingItems",JSON.stringify(items));render()});
  if(listToken)mutateShared("/api/shopping-list/items/"+encodeURIComponent(b.dataset.del),"DELETE",undefined,()=>items.splice(Math.min(index,items.length),0,removed));
  else saveLocal()
 });
}
function guessCategory(name){const s=String(name||"").toLocaleLowerCase("sv-SE");if(/mjölk|havredryck|sojadryck|mandeldryck|ost|smör|margarin|yoghurt|kvarg|grädde|crème fraiche|creme fraiche|ägg|fil|keso/.test(s))return"Mejeri";if(/äpple|päron|banan|apelsin|citron|lime|tomat|gurka|paprika|morot|potatis|sallad|lök|avokado|frukt|grönsak|broccoli|blomkål|druv|bär/.test(s))return"Frukt & grönt";if(/kött|kyckling|fisk|lax|räk|skaldjur|korv|färs|bacon|skinka|fläsk|nötfärs/.test(s))return"Kött & fisk";if(/bröd|pasta|ris|mjöl|kaffe|te|socker|konserv|sås|krydda|olja|vinäger|havregryn|flingor|knäckebröd|bulgur|couscous/.test(s))return"Skafferi";if(/glass|fryst|frys|ispinne/.test(s))return"Frys";if(/disk|tvätt|toalett|hushållspapper|bakplåtspapper|såpa|rengör|städ|soppåse|tvål|schampo|tandkräm/.test(s))return"Hushåll";return"Övrigt"}
$("addForm").onsubmit=async e=>{
 e.preventDefault();
 const names=[...new Set($("itemInput").value.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean))];
 if(!names.length)return;
 const priceRaw=$("itemPrice").value.trim();
 if(names.length>1&&priceRaw!==""){toast("Lägg till pris separat när du lägger in flera varor.");return}
 const price=priceRaw===""?null:Number(priceRaw.replace(",","."));
 if(price!==null&&(!Number.isFinite(price)||price<0||price>999999)){toast("Ange ett giltigt pris.");return}
 const pending=names.map(name=>({id:"pending-"+crypto.randomUUID(),name,category:guessCategory(name),qty:"",price,done:false,is_favorite:false}));
 names.forEach(rememberSuggestion);
 items.unshift(...pending);
 localStorage.setItem("shoppingItems",JSON.stringify(items));render();
 $("itemInput").value="";$("itemPrice").value="";$("itemInput").focus();
 const submitButton=$("addForm").querySelector('button[type="submit"]');
 submitButton.textContent=pending.length+" tillagda ✓";
 setTimeout(()=>{submitButton.textContent="＋ Lägg till";},900);
 if(!listToken){toast(pending.length===1?"Varan tillagd":pending.length+" varor tillagda");return}
 pendingMutations++;
 try{
  const endpoint=await currentPushEndpoint();
  const results=await Promise.allSettled(pending.map(async item=>{
   const response=await api("/api/shopping-list/items","POST",{name:item.name,category:item.category,qty:"",price:item.price,source_endpoint:endpoint});
   if(!response||!response.item||!response.item.id)throw new Error("Servern bekräftade inte "+item.name+".");
   const index=items.findIndex(x=>x.id===item.id);
   if(index>=0)items[index]=response.item;
   return item.name;
  }));
  const failed=[];
  results.forEach((result,index)=>{if(result.status==="rejected"){failed.push(pending[index]);items=items.filter(x=>x.id!==pending[index].id)}});
  localStorage.setItem("shoppingItems",JSON.stringify(items));render();
  const succeeded=pending.length-failed.length;
  if(failed.length){toast((succeeded?succeeded+" tillagda · ":"")+failed.length+" kunde inte sparas");setSyncStatus("Några varor kunde inte sparas · försök igen")}
  else{toast(succeeded===1?"Varan tillagd":succeeded+" varor tillagda");setSyncStatus("Delad lista · synkas automatiskt")}
 }finally{
  pendingMutations=Math.max(0,pendingMutations-1);
 }
};

function urlBase64ToUint8Array(value){
 const padding="=".repeat((4-value.length%4)%4);
 const raw=atob((value+padding).replace(/-/g,"+").replace(/_/g,"/"));
 return Uint8Array.from([...raw].map(char=>char.charCodeAt(0)));
}
async function ensurePushSubscription(){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)||Notification.permission!=="granted")return null;
 const registration=await navigator.serviceWorker.register("./sw.js");
 await navigator.serviceWorker.ready;
 const keyResponse=await fetch(API_BASE+"/api/push/public-key",{cache:"no-store"});
 if(!keyResponse.ok)throw new Error("Pushnotiser är inte konfigurerade på servern.");
 const keyData=await keyResponse.json();
 let subscription=await registration.pushManager.getSubscription();
 if(!subscription){
  subscription=await registration.pushManager.subscribe({
   userVisibleOnly:true,
   applicationServerKey:urlBase64ToUint8Array(keyData.public_key)
  });
 }
 if(listToken){
  await api("/api/shopping-list/push/subscribe","POST",{subscription:subscription.toJSON()});
 }
 return subscription;
}
async function currentPushEndpoint(){
 if(localStorage.getItem("shoppingNotificationsEnabled")!=="yes"||!("serviceWorker" in navigator))return "";
 try{
  const registration=await navigator.serviceWorker.ready;
  const subscription=await registration.pushManager.getSubscription();
  return subscription?subscription.endpoint:"";
 }catch{return ""}
}
async function enableNotifications(){
 if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){
  toast("Den här webbläsaren stöder inte bakgrundsnotiser.");return;
 }
 try{
  const permission=await Notification.requestPermission();
  if(permission!=="granted"){toast("Notiser tilläts inte. Du kan ändra det i inställningarna.");return}
  localStorage.setItem("shoppingNotificationsEnabled","yes");
  const subscription=await ensurePushSubscription();
  if(!subscription)throw new Error("Kunde inte skapa en pushprenumeration.");
  $("notify").setAttribute("aria-pressed","true");
  toast(listToken?"Bakgrundsnotiser aktiverade på den här enheten":"Tillåtet! Notiser kopplas till listan när den delas.");
 }catch(error){toast("Kunde inte aktivera notiser: "+error.message)}
}

 function applyBackgroundOpacity(value){

  document.body.style.setProperty("--shopping-bg-opacity",String(opacity/100));
  $("backgroundOpacity").value=String(opacity);

 let currentBackgroundPath="",backgroundObjectUrl="",backgroundLoadingPath="";
 function applySharedBackground(url){
  if(url){
   document.body.classList.add("has-custom-bg");
   document.body.style.setProperty("--shopping-bg-image",'url("'+String(url).replace(/["\\]/g,"\\$&")+'")');
  }else{
   document.body.classList.remove("has-custom-bg");
   document.body.style.removeProperty("--shopping-bg-image");
  }
 }
 async function loadSharedBackground(path){
  const next=String(path||"");
  if(next===currentBackgroundPath||next===backgroundLoadingPath)return;
  if(!next){
   backgroundLoadingPath="";
   currentBackgroundPath="";
   if(backgroundObjectUrl)URL.revokeObjectURL(backgroundObjectUrl);
   backgroundObjectUrl="";
   applySharedBackground("");
   return;
  }
  if(!listToken)return;
  backgroundLoadingPath=next;
  try{
   const response=await fetch(API_BASE+"/api/shopping-list/background",{headers:{Authorization:"Bearer "+listToken},cache:"no-store"});
   if(!response.ok)throw new Error("Bakgrundsbilden kunde inte hämtas.");
   const blob=await response.blob();
   if(backgroundLoadingPath!==next)return;
   const nextUrl=URL.createObjectURL(blob);
   const previous=backgroundObjectUrl;
   backgroundObjectUrl=nextUrl;
   currentBackgroundPath=next;
   backgroundLoadingPath="";
   applySharedBackground(nextUrl);
   if(previous)URL.revokeObjectURL(previous);
  }catch(error){if(backgroundLoadingPath===next)backgroundLoadingPath="";throw error;}
 }
 applyBackgroundOpacity(localStorage.getItem("shoppingBackgroundOpacity")||22);

 function compressBackgroundImage(file){
  return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=()=>reject(new Error("Bilden kunde inte läsas."));
   reader.onload=()=>{
    const image=new Image();
    image.onerror=()=>reject(new Error("Bilden kunde inte öppnas."));
    image.onload=()=>{
     const scale=Math.min(1,1800/Math.max(image.width,image.height));
     const canvas=document.createElement("canvas");
     canvas.width=Math.max(1,Math.round(image.width*scale));
     canvas.height=Math.max(1,Math.round(image.height*scale));
     canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
     const data=canvas.toDataURL("image/jpeg",.78);
     if(data.length>6.8*1024*1024){reject(new Error("Bilden är för stor även efter komprimering."));return}
     resolve(data);
    };
    image.src=reader.result;
   };
   reader.readAsDataURL(file);
  });
 }

   const match=String(pasted).match(/(?:#|&)list=([^&]+)/);

   const result=await api("/api/shopping-list/background/import","POST",{source_token:sourceToken});
   currentBackgroundPath="";
   await loadSharedBackground(result.background_path||"");

$("templatesBtn").onclick=()=>{
 const templates=[{name:"Veckohandling",items:["Mjölk","Ägg","Bröd","Smör","Bananer","Pasta"]},{name:"Frukost",items:["Mjölk","Yoghurt","Ägg","Bröd","Ost"]},{name:"Storhandling",items:["Mjölk","Ägg","Bröd","Smör","Potatis","Pasta","Ris","Kyckling","Toalettpapper","Diskmedel"]}];
 const saved=JSON.parse(localStorage.getItem("shoppingTemplates")||"[]");
 const all=[...templates,...saved];
 openModal("<h2>Färdiga inköpslistor</h2>"+all.map((t,i)=>'<p><button class="chip" data-template="'+i+'">'+esc(t.name)+" · "+t.items.length+" varor</button></p>").join("")+'<p><button class="chip" id="saveTemplate">Spara nuvarande lista som egen mall</button></p>');
 $("modalContent").querySelectorAll("[data-template]").forEach(b=>b.onclick=async()=>{
  const t=all[Number(b.dataset.template)];
  const entries=t.items.map(entry=>typeof entry==="string"?{name:entry,category:guessCategory(entry),qty:"",price:null}:{...entry,category:entry.category||guessCategory(entry.name),qty:entry.qty||"",price:null});
  const pending=entries.map(entry=>({id:"pending-"+crypto.randomUUID(),...entry,done:false}));
  items.unshift(...pending);
  localStorage.setItem("shoppingItems",JSON.stringify(items));
  render();
  $("modal").classList.remove("open");
  if(!listToken){toast(t.name+" tillagd");return}
  pendingMutations++;
  try{
   const endpoint=await currentPushEndpoint();
   const results=await Promise.allSettled(pending.map(async(item,index)=>{
    const response=await api("/api/shopping-list/items","POST",{name:item.name,category:item.category,qty:item.qty,price:item.price,source_endpoint:endpoint});
    return {index,item:response.item};
   }));
   const failed=[];
   results.forEach((result,index)=>{
    if(result.status==="fulfilled"&&result.value.item){
     const position=items.findIndex(x=>x.id===pending[index].id);
     if(position>=0)items[position]=result.value.item;
    }else{
     failed.push(pending[index]);
     items=items.filter(x=>x.id!==pending[index].id);
    }
   });
   localStorage.setItem("shoppingItems",JSON.stringify(items));
   render();
   const succeeded=pending.length-failed.length;
   toast(failed.length?succeeded+" tillagda · "+failed.length+" kunde inte sparas":t.name+" tillagd");
   if(failed.length)setSyncStatus("Några varor kunde inte sparas · försök igen");
  }catch(error){
   items=items.filter(x=>!pending.some(p=>p.id===x.id));
   localStorage.setItem("shoppingItems",JSON.stringify(items));
   render();
   toast("Mallen kunde inte sparas: "+error.message);
  }finally{pendingMutations=Math.max(0,pendingMutations-1)}
 });
