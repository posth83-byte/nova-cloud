<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Cloud/JARVIS</title>
    <link rel="stylesheet" href="style.css">
    <script src="accessibility.js" defer></script>
    <script src="game.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
    <header class="p-4">
        <h1 class="text-4xl font-bold">NOVA Cloud/JARVIS</h1>
    </header>
    <main class="flex flex-col items-center">
        <div id="game-container" class="w-full max-w-lg p-4">
            <canvas id="gameCanvas" class="border border-gray-600"></canvas>
            <button id="startButton" class="mt-4 p-2 bg-blue-600 rounded hover:bg-blue-700">Starta Spelet</button>
        </div>
    </main>
    <footer class="p-4">
        <p>© 2023 NOVA Cloud. Alla rättigheter förbehållna.</p>
    </footer>
    <script>
        const startButton = document.getElementById('startButton');
        startButton.addEventListener('click', function() {
            if (typeof JarvisCatcher !== 'undefined' && JarvisCatcher.start) {
                JarvisCatcher.start();
            } else {
                console.error('Spelstartfunktionen är inte tillgänglig.');
            }
        });
    </script>
</body>
</html>
