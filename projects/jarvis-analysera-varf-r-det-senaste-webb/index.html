<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WILD FRONTIER - SURVIVAL</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-glow { box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">
    <!-- Header -->
    <header class="border-b border-cyan-900/50 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-orbitron font-extrabold text-lg md:text-xl text-cyan-400">
                WILD <span class="text-white">FRONTIER</span>
            </h1>
            <div class="text-xs font-orbitron text-cyan-300 border border-cyan-800/60 px-3 py-1 rounded-full bg-cyan-950/30">
                VERIFIERAD MODULÄR LEVERANS
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-3xl mx-auto px-4 py-6 flex-grow w-full flex flex-col items-center justify-center">
        <div class="w-full max-w-xl bg-slate-900/90 border border-cyan-500/30 rounded-2xl p-4 neon-glow relative">
            <!-- HUD -->
            <div class="flex justify-between items-center mb-3 font-orbitron text-xs md:text-sm border-b border-cyan-900/40 pb-2">
                <div>PROVISIONER: <span id="wf-score" class="text-cyan-400 font-bold">0</span></div>
                <div>HÄLSA: <span id="wf-health" class="text-red-400 font-bold">100</span></div>
                <div>STATUS: <span id="wf-status" class="text-yellow-400 font-semibold">REDO</span></div>
            </div>
            <!-- Canvas -->
            <div class="relative w-full aspect-[4/3] bg-slate-950 rounded-xl overflow-hidden border border-cyan-900/50 flex items-center justify-center">
                <canvas id="wf-canvas" class="w-full h-full block cursor-crosshair"></canvas>
                <!-- Overlay -->
                <div id="wf-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                    <h3 class="font-orbitron text-xl md:text-2xl font-bold text-white mb-2">WILD FRONTIER</h3>
                    <p class="text-slate-300 text-xs md:text-sm mb-6 max-w-xs">Samla resurser och undvik faror i vildmarken.</p>
                    <button id="wf-start-btn" class="font-orbitron bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-8 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/30 active:scale-95 cursor-pointer">
                        STARTA EXPEDITION
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-slate-600 text-xs font-orbitron border-t border-slate-900">
        JARVIS & WEBMASTER ARKITEKTUR &copy; 2025 - Alla filer kontrollerade och intakta
    </footer>

    <!-- Länkad separat spelmotor -->
    <script src="game.js"></script>
</body>
</html>
